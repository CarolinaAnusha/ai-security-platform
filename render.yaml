services:
  # ── BACKEND ──────────────────────────────────
  - type: web
    name: ai-security-backend
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false

  # ── FRONTEND ─────────────────────────────────
  - type: web
    name: ai-security-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: ai-security-backend
          type: web
          property: host